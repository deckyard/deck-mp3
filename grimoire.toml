# Grimoire book configuration for the @deckyard/mp3 documentation.

[book]
title = "@deckyard/mp3"
description = "Read and edit MP3 metadata and build M3U playlists from Jennifer."
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-mp3/"
repoUrl = "https://github.com/deckyard/deck-mp3"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-mp3/edit/main/docs/{path}"
footer = 'Part of <a href="https://github.com/deckyard">Deckyard</a>, community decks for <a href="https://jennifer-lang.dev/">Jennifer</a>. Rendered with <a href="https://grimoire.jennifer-lang.dev/">Grimoire</a>.'

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
